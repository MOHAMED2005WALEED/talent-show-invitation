<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e7ff" />
      <stop offset="100%" stop-color="#e1d4fc" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" />
  
  <!-- Decorative Sound Waves / Circles -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="6 6" opacity="0.8" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4" />

  <!-- Floating Music Notes -->
  <g fill="#7c3aed" opacity="0.7">
    <!-- Note 1 -->
    <path d="M 110 150 L 110 110 L 140 100 L 140 130 Z" />
    <circle cx="105" cy="150" r="10" />
    <circle cx="135" cy="130" r="10" />
    <!-- Note 2 -->
    <path d="M 270 130 L 270 95 L 300 85 L 300 115 Z" />
    <circle cx="265" cy="130" r="9" />
    <circle cx="295" cy="115" r="9" />
  </g>

  <!-- Microphone Icon Group -->
  <g transform="translate(200, 185)">
    <!-- Stand Arc / Holder -->
    <path d="M -35 -5 C -35 25 35 25 35 -5" fill="none" stroke="#5b21b6" stroke-width="6" stroke-linecap="round" />
    <!-- Lower Straight Stand -->
    <line x1="0" y1="22" x2="0" y2="70" stroke="#5b21b6" stroke-width="6" stroke-linecap="round" />
    <!-- Base Base Plate -->
    <path d="M -25 70 L 25 70" stroke="#5b21b6" stroke-width="6" stroke-linecap="round" />
    
    <!-- Mic Capsule Body -->
    <rect x="-20" y="-65" width="40" height="65" rx="20" fill="url(#micGrad)" />
    <!-- Mic Grille Highlights / Details -->
    <line x1="-12" y1="-50" x2="12" y2="-50" stroke="#ede9fe" stroke-width="2" opacity="0.6" />
    <line x1="-14" y1="-38" x2="14" y2="-38" stroke="#ede9fe" stroke-width="2" opacity="0.6" />
    <line x1="-12" y1="-26" x2="12" y2="-26" stroke="#ede9fe" stroke-width="2" opacity="0.6" />
  </g>
</svg>
